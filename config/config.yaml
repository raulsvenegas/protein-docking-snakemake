
# FHNW Exercise 4
# Automated Protein-Protein Docking Workflow

# Protein pairs
protein_pairs:
  e2a_hpr:
    receptor: "data/prepared/e2a_hpr/eiia_repaired.pdb"
    ligand: "data/prepared/e2a_hpr/hpr_model1.pdb"

  barnase_barstar:
    # Second, genuinely different biological pair; RCSB PDB 1BRS.
    # Barnase = chain A (receptor); Barstar = chain D (ligand).
    receptor: "data/prepared/barnase_barstar/receptor.pdb"
    ligand: "data/prepared/barnase_barstar/ligand.pdb"
    preparation:
      receptor:
        source: "data/raw/barnase_barstar/1BRS.pdb"
        chain: "A"
        model: 1
        repair_missing_atoms: false
        add_hydrogens: false
      ligand:
        source: "data/raw/barnase_barstar/1BRS.pdb"
        chain: "D"
        model: 1
        repair_missing_atoms: false
        add_hydrogens: false

  two_uuy:
    receptor: "data/prepared/two_uuy/receptor.pdb"
    ligand: "data/prepared/two_uuy/ligand.pdb"
    preparation:
      receptor:
        source: "data/raw/2UUY/2UUY_rec.pdb"
        chain: "A"
        model: 1
        repair_missing_atoms: false
        add_hydrogens: false
      ligand:
        source: "data/raw/2UUY/2UUY_lig.pdb"
        chain: "B"
        model: 1
        repair_missing_atoms: false
        add_hydrogens: false

# The optional `all_pairs` target runs these pairs via a shared pipeline.
# The original Snakemake default `all` still targets EIIA/HPr NMR only.
multi_pair_targets:
  - e2a_hpr
  - barnase_barstar
  - two_uuy

# HPr NMR ensemble
hpr_models:
  source: "data/raw/e2a_hpr/1HDN.pdb"
  first: 1
  last: 30

# LightDock simulation parameters
docking:
  swarms: 2
  glowworms: 10
  steps: 10
  seed: 12345
  cores: 1

# Output directory
results_dir: "results"
